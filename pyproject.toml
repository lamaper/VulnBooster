[project]
name = "vulnbooster"
version = "0.1.0"
description = "Research pipeline for data-augmentation-driven source code vulnerability detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "openai>=1.40.0",
  "requests>=2.32.3",
  "scikit-learn>=1.5.1",
  "torch>=2.4.0",
  "tqdm>=4.66.5",
  "transformers>=4.44.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-c>=0.23.1",
  "tree-sitter-cpp>=0.23.1",
]

[project.scripts]
vulnbooster = "vulnbooster.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnbooster"]

[tool.uv]
package = true
